<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>AWS環境ランチャー</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <h1>AWS環境ランチャー</h1>
    <button id="openOptionsBtn" class="icon-btn" title="環境を登録・編集する">⚙ 管理</button>
  </header>

  <div class="tab-row" id="tabRow">
    <button class="tab-btn" data-type="login">ログイン環境</button>
    <button class="tab-btn" data-type="switchRole">スイッチロール</button>
  </div>

  <div class="search-row">
    <input id="searchInput" type="text" placeholder="表示名・アカウントIDで絞り込み" />
  </div>

  <div id="emptyState" class="empty-state" hidden>
    <p>登録された環境がありません。</p>
    <button id="emptyStateAddBtn" class="primary-btn">環境を登録する</button>
  </div>

  <ul id="itemList" class="item-list"></ul>

  <div id="toast" class="toast" hidden></div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
