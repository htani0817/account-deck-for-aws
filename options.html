<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>AWS環境ランチャー - 管理</title>
<link rel="stylesheet" href="options.css" />
</head>
<body>
  <header class="header">
    <h1>AWS環境ランチャー - 環境の登録・編集</h1>
  </header>

  <main class="container">
    <form id="itemForm" class="form-card">
      <input type="hidden" id="editingId" value="" />

      <div class="field-row">
        <label>種別</label>
        <div class="radio-group">
          <label><input type="radio" name="type" value="login" checked /> ログイン情報（URL・ユーザー名・パスワード）</label>
          <label><input type="radio" name="type" value="switchRole" /> スイッチロール（アカウントID・ロール名）</label>
        </div>
      </div>

      <div class="field-row">
        <label for="displayName">表示名 <span class="required">必須</span></label>
        <input type="text" id="displayName" placeholder="例: 本番環境 / 開発環境 / ○○環境" required />
      </div>

      <div class="field-row">
        <label for="accountId">AWSアカウントID <span class="required">必須</span></label>
        <input type="text" id="accountId" placeholder="例: 123456789012" required />
      </div>

      <fieldset id="loginFields" class="type-fields">
        <div class="field-row">
          <label for="url">ログインURL <span class="required">必須</span></label>
          <input type="url" id="url" placeholder="https://123456789012.signin.aws.amazon.com/console" />
        </div>
        <div class="field-row">
          <label for="username">ユーザー名</label>
          <input type="text" id="username" placeholder="IAMユーザー名" />
        </div>
        <div class="field-row">
          <label for="password">パスワード</label>
          <input type="text" id="password" placeholder="パスワード" />
        </div>
        <div class="field-row">
          <label for="memo">メモ</label>
          <input type="text" id="memo" placeholder="任意メモ" />
        </div>
        <p class="hint">
          「開く」を押すとAWSサインイン画面のユーザー名/パスワード欄に自動入力します（サインインボタンの押下・MFA入力は行いません）。
        </p>
      </fieldset>

      <fieldset id="switchRoleFields" class="type-fields" hidden>
        <div class="field-row">
          <label for="roleName">ロール名 <span class="required">必須</span></label>
          <input type="text" id="roleName" placeholder="例: AdministratorRole" />
        </div>
        <div class="field-row">
          <label for="color">表示色（任意）</label>
          <input type="color" id="color" value="#f2b0a9" />
        </div>
        <p class="hint">
          スイッチロールは、事前にAWSマネジメントコンソールへログイン済みであることが前提です。
        </p>
      </fieldset>

      <div class="form-actions">
        <button type="submit" id="saveBtn" class="primary-btn">登録する</button>
        <button type="button" id="cancelEditBtn" class="secondary-btn" hidden>編集をキャンセル</button>
      </div>
    </form>

    <section class="list-section">
      <div class="list-section__header">
        <h2>登録済み環境一覧</h2>
        <div class="export-import-actions">
          <button type="button" id="exportBtn" class="secondary-btn">エクスポート</button>
          <button type="button" id="importBtn" class="secondary-btn">インポート</button>
          <input type="file" id="importFileInput" accept="application/json,.json" hidden />
        </div>
      </div>
      <p class="hint">
        他のブラウザ・PCへ設定を移行する場合は「エクスポート」でJSONファイルを保存し、移行先で「インポート」してください。インポートは既存の登録内容に追加されます（上書きはしません）。
      </p>
      <table class="item-table">
        <thead>
          <tr>
            <th>種別</th>
            <th>表示名</th>
            <th>アカウントID</th>
            <th>詳細</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="itemTableBody"></tbody>
      </table>
      <p id="emptyMessage" class="hint" hidden>登録された環境がありません。上のフォームから追加してください。</p>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
